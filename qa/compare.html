<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #202020; color: white; font: 14px sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; }
      img { width: 100%; height: auto; display: block; border: 1px solid #666; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Source visual</figcaption><img src="./source-design.png" alt="Source visual" /></figure>
      <figure><figcaption>Implementation: homepage</figcaption><img src="./implementation-home-desktop.png" alt="Homepage implementation" /></figure>
    </main>
  </body>
</html>
